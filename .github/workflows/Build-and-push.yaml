name: build and push
on:
  push: {}
  repository_dispatch:
    types: [run]
  workflow_dispatch: {}
  workflow_call: {}
jobs:
  build_and_push_to_registry:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: [22, 24]
    env:
      STACK_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Cache var-cache-apt
        uses: actions/cache@v5
        with:
          path: var-cache-apt
          key: var-cache-apt-${{ hashFiles('Dockerfile') }}
      - name: Cache var-lib-apt
        uses: actions/cache@v5
        with:
          path: var-lib-apt
          key: var-lib-apt-${{ hashFiles('Dockerfile') }}
      - name: inject var-lib-apt into docker
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            { 
               "var-cache-apt": "/var/cache/apt",
               "var-lib-apt": "/var/lib/apt" 
            }
      - name: Build and push for stack ${{ env.STACK_VERSION }}
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            STACK_VERSION=-${{ env.STACK_VERSION }}
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ github.ref_name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ github.ref_name }}:latest-${{ env.STACK_VERSION }}
            ghcr.io/${{ github.repository }}/${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
